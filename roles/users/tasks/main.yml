---
# tasks file for users
- name: Add user domin and groups
  become: true
  ansible.builtin.user:
    name: domin
    shell: /bin/bash
    create_home: true
    groups: adm,sudo
    append: true
    state: present

- name: Add ssh pub key for user domin
  become: true
  ansible.posix.authorized_key:
    user: domin
    state: present
    key: "{{ item }}"
  with_file:
    - "ssh.pub_key file inside file folder"

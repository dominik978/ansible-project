---
# tasks file for users
- name: Add user domin and groups
  become: true
  ansible.builtin.user:
    name: "your username"
    shell: /bin/bash
    create_home: true
    groups: adm,sudo
    append: true
    state: present

- name: Add ssh pub key for user domin
  become: true
  ansible.posix.authorized_key:
    user: "your username"
    state: present
    key: "{{ item }}"
  with_file:
    - pub_keys/ssh_key.pub
